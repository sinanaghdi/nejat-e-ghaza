name: Secret scanning

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan repository history for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Refuse tracked runtime env files
        shell: bash
        run: |
          tracked_env_files="$(git ls-files | awk '
            {
              name = $0
              sub(/^.*\//, "", name)
              if (name == ".env" || (name ~ /^\.env\./ && name != ".env.example")) print $0
            }
          ')"
          if [ -n "$tracked_env_files" ]; then
            echo "Refusing to proceed: runtime environment files are tracked:"
            echo "$tracked_env_files"
            exit 1
          fi

      - name: Scan for credentials, tokens and private keys
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
